# Двойные рамки
set -g pane-border-lines "double"
# Включаем мышь (скролл, выбор панелей, ресайз)
set -g mouse on
# Нумерация окон и панелей с 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Убираем задержку Esc (критично для Vim/Neovim) и увеличиваем буфер истории
set -sg escape-time 0
set -g history-limit 50000

# Включаем правильную цветопередачу (TrueColor)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Изменение размера панели с помощью Alt+Shift+стрелки
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

# Разделение окон через "Ctrl+a |" "Ctrl+a -" в текущей директории
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Новое окно тоже открывается в текущей директории
bind c new-window -c "#{pane_current_path}"

# Оформиление нижнего статус-бара
# Настройка общего фона панели (статус-бара)
set -g status-style bg=colour235,fg=white

# 2Разделитель между прямоугольниками (обычный пробел)
set -g window-status-separator " "

# Cтиль для ОБЫЧНЫХ (неактивных) окон
set -g window-status-format "#[bg=colour238,fg=colour250] #I:#W "

# Стиль для ТЕКУЩЕГО (активного) окна
set -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I:#W "